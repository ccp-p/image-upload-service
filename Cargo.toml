[package]
name = "hash-cdn"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hash-cdn"
path = "main_new.rs"

[dependencies]
# Pure std-lib: zero external crates for minimal binary size on low-spec devices
oxc_allocator = "0.143"
oxc_codegen = "0.143"
oxc_mangler = "0.143"
oxc_minifier = "0.143"
oxc_parser = "0.143"
oxc_span = "0.143"
